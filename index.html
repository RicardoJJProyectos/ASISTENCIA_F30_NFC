<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escáner de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="p-4 font-sans text-gray-800">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Control de Acceso</h1>

    <!-- PANTALLA LOGIN -->
    <div id="pantallaLogin">
      <label class="block text-sm font-medium text-gray-700">Nombre del Prefecto/Maestro:</label>
      <input type="text" id="nombrePrefecto" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-blue-500 focus:ring-blue-500" placeholder="Ej. Prof. Roberto">
      <button onclick="iniciarSesion()" class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg font-bold">Iniciar Turno</button>
      <p id="cargandoAlumnos" class="text-sm text-center text-blue-600 mt-2 hidden font-bold">Descargando base de datos, espera...</p>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="pantallaEscaneo" class="hidden">
      <p class="text-center text-sm font-semibold mb-4 bg-green-100 text-green-800 p-2 rounded" id="infoUsuario"></p>

      <!-- BOTONES NFC Y QR -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <button onclick="iniciarNFC()" class="bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold flex flex-col items-center shadow-lg">
          <span class="text-3xl mb-1">📡</span> Escanear NFC
        </button>
        <button onclick="alert('Función de cámara QR en desarrollo.')" class="bg-gray-800 hover:bg-gray-900 text-white py-4 rounded-xl font-bold flex flex-col items-center shadow-lg">
          <span class="text-3xl mb-1">📷</span> Escanear QR
        </button>
      </div>

      <div id="estadoNFC" class="text-center text-sm font-bold h-6 mb-4 text-gray-600"></div>

      <!-- BOTÓN PARA ABRIR MENÚ MANUAL -->
      <button onclick="toggleManual()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-bold shadow mb-4 flex justify-center items-center">
        <span>📝 Abrir Menú Manual / Justificantes</span>
      </button>

      <!-- SECCIÓN REGISTRO MANUAL (Oculta por defecto) -->
      <div id="seccionManual" class="hidden border-t pt-4 border-gray-200 bg-gray-50 p-4 rounded-lg">
        <h3 class="text-md font-bold text-gray-700 mb-3 text-center">Registro Manual</h3>
        
        <!-- Filtros -->
        <div class="grid grid-cols-3 gap-2 mb-3">
          <select id="filtroTurno" onchange="filtrarAlumnos()" class="border p-2 rounded text-sm bg-white"><option value="MATUTINO">Matutino</option><option value="VESPERTINO">Vespertino</option></select>
          <select id="filtroGrado" onchange="filtrarAlumnos()" class="border p-2 rounded text-sm bg-white"><option value="1">1º</option><option value="2">2º</option><option value="3">3º</option></select>
          <select id="filtroGrupo" onchange="filtrarAlumnos()" class="border p-2 rounded text-sm bg-white"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select>
        </div>

        <label class="block text-xs font-bold text-gray-600 mb-1">Seleccionar Alumno:</label>
        <select id="selectAlumno" class="w-full border border-blue-400 p-2 rounded mb-3 bg-white shadow-sm">
          <option value="">-- Primero elige Turno, Grado y Grupo --</option>
        </select>

        <label class="block text-xs font-bold text-gray-600 mb-1">Tipo de Registro:</label>
        <select id="selectAccion" class="w-full border p-2 rounded mb-3 text-blue-800 font-bold bg-blue-100">
          <option value="MANUAL">✅ Asistencia Manual (Olvidó Tarjeta)</option>
          <option value="JUSTIFICADA">⚠️ Falta Justificada (Enfermedad/Aviso)</option>
        </select>

        <label class="block text-xs font-bold text-gray-600 mb-1">Motivo / Notas (Opcional):</label>
        <input type="text" id="inputObservaciones" class="w-full border p-2 rounded mb-4" placeholder="Ej. Cita médica, Problema familiar...">
        
        <button onclick="registrarManual()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-bold shadow-lg text-lg">
          💾 Guardar Registro
        </button>
      </div>

      <!-- COLA OFFLINE -->
      <div id="offlineBanner" class="hidden mt-4 bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-2 text-xs text-center rounded">
        Estás sin conexión. Registros pendientes: <span id="colaCount" class="font-bold text-red-600">0</span>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TU NUEVA URL DEL SCRIPT (Asegúrate de haber creado una NUEVA VERSIÓN)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec"; 
    
    let usuarioActivo = "";
    let baseAlumnos = []; 
    let colaOffline = JSON.parse(localStorage.getItem('colaAsistencia')) || [];
    let ultimosEscaneos = {}; 

    async function iniciarSesion() {
      usuarioActivo = document.getElementById("nombrePrefecto").value.trim();
      if(!usuarioActivo) return alert("Ingresa tu nombre");
      
      const btnLoading = document.getElementById("cargandoAlumnos");
      btnLoading.classList.remove("hidden");
      
      try {
        const res = await fetch(APPS_SCRIPT_URL + "?action=getAlumnos");
        const textoRespuesta = await res.text(); // Leemos como texto primero para evitar errores silenciosos
        
        try {
          baseAlumnos = JSON.parse(textoRespuesta);
          localStorage.setItem("alumnosCache", JSON.stringify(baseAlumnos));
        } catch (jsonErr) {
          console.error("El servidor no devolvió un JSON:", textoRespuesta);
          alert("Error: Google Sheets no devolvió los alumnos. Verifica que hayas publicado una NUEVA VERSIÓN del script.");
          throw new Error("Respuesta inválida");
        }
      } catch (err) {
        baseAlumnos = JSON.parse(localStorage.getItem("alumnosCache") || "[]");
        if(baseAlumnos.length === 0) {
          alert("Sin conexión y sin caché. La lista manual estará vacía.");
        } else {
          alert("Trabajando en modo offline. Se cargó la lista de alumnos guardada previamente.");
        }
      }

      document.getElementById("pantallaLogin").classList.add("hidden");
      document.getElementById("pantallaEscaneo").classList.remove("hidden");
      document.getElementById("infoUsuario").innerText = "Activo: " + usuarioActivo;
      
      filtrarAlumnos(); 
      actualizarUIOffline();
    }

    function toggleManual() {
      const seccion = document.getElementById("seccionManual");
      if(seccion.classList.contains("hidden")) {
        seccion.classList.remove("hidden");
        // Hacemos scroll hacia abajo suavemente para que el usuario lo vea
        seccion.scrollIntoView({ behavior: 'smooth' });
      } else {
        seccion.classList.add("hidden");
      }
    }

    function filtrarAlumnos() {
      const turno = document.getElementById("filtroTurno").value;
      const grado = document.getElementById("filtroGrado").value;
      const grupo = document.getElementById("filtroGrupo").value;
      
      const select = document.getElementById("selectAlumno");
      select.innerHTML = '<option value="">-- Selecciona un alumno --</option>';
      
      const filtrados = baseAlumnos.filter(a => a.turno === turno && a.grado === grado && a.grupo === grupo);
      
      if(filtrados.length === 0) {
        select.innerHTML = '<option value="">No hay alumnos en este grupo</option>';
        return;
      }

      // Ordenar alfabéticamente
      filtrados.sort((a, b) => a.nombre.localeCompare(b.nombre));

      filtrados.forEach(a => {
        let opt = document.createElement("option");
        opt.value = a.id;
        opt.text = a.nombre;
        select.appendChild(opt);
      });
    }

    // (El resto de las funciones NFC y procesarEscaneo se mantienen igual)
    async function iniciarNFC() {
      if (!("NDEFReader" in window)) return alert("NFC no soportado en este dispositivo (Usa Chrome en Android).");
      const estado = document.getElementById("estadoNFC");
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        estado.innerText = "Acerca la tarjeta al teléfono...";
        estado.className = "text-center text-sm font-bold h-6 mb-4 text-blue-600 animate-pulse";
        
        ndef.addEventListener("reading", ({ message }) => {
          for (const record of message.records) {
            const textDecoder = new TextDecoder(record.encoding);
            const idNfc = textDecoder.decode(record.data);
            procesarEscaneo(idNfc, "ESCANEO_NFC", "");
          }
        });
      } catch (error) {
        estado.innerText = "Error NFC: " + error;
      }
    }

    function registrarManual() {
      const idNfc = document.getElementById("selectAlumno").value;
      const accion = document.getElementById("selectAccion").value;
      const obs = document.getElementById("inputObservaciones").value;
      
      if(!idNfc) return alert("Por favor selecciona un alumno.");
      
      procesarEscaneo(idNfc, accion, obs);
      
      document.getElementById("selectAlumno").value = "";
      document.getElementById("inputObservaciones").value = "";
      toggleManual(); // Ocultar menú tras registrar
    }

    function procesarEscaneo(idNfc, accion, observaciones) {
      const ahora = Date.now();
      if (ultimosEscaneos[idNfc] && (ahora - ultimosEscaneos[idNfc] < 600000)) {
        if ("vibrate" in navigator) navigator.vibrate([100, 50, 100]);
        alert("⚠️ TARJETA YA REGISTRADA HACE MENOS DE 10 MINUTOS.");
        return;
      }
      
      ultimosEscaneos[idNfc] = ahora;
      if ("vibrate" in navigator) navigator.vibrate(200);

      const payload = { accion, idNfc, registradoPor: usuarioActivo, observaciones };

      if (navigator.onLine) {
        enviarAGoogle(payload);
      } else {
        colaOffline.push(payload);
        localStorage.setItem('colaAsistencia', JSON.stringify(colaOffline));
        actualizarUIOffline();
        alert("Sin internet. Guardado localmente.");
      }
    }

    function enviarAGoogle(payload) {
      document.getElementById("estadoNFC").innerText = "Enviando...";
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("estadoNFC").innerText = "¡Listo!";
        alert(data.message);
      })
      .catch(err => {
        colaOffline.push(payload);
        localStorage.setItem('colaAsistencia', JSON.stringify(colaOffline));
        actualizarUIOffline();
      });
    }

    window.addEventListener('online', () => {
      if(colaOffline.length > 0) {
        const tempCola = [...colaOffline];
        colaOffline = [];
        localStorage.removeItem('colaAsistencia');
        actualizarUIOffline();
        
        tempCola.forEach(payload => {
          fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        });
        alert("Conexión restaurada. Sincronizando registros atrasados.");
      }
    });

    window.addEventListener('offline', actualizarUIOffline);

    function actualizarUIOffline() {
      const banner = document.getElementById("offlineBanner");
      if (!navigator.onLine || colaOffline.length > 0) {
        banner.classList.remove("hidden");
        document.getElementById("colaCount").innerText = colaOffline.length;
      } else {
        banner.classList.add("hidden");
      }
    }
  </script>
</body>
</html>
